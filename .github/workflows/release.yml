name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet build -c Release -o dist -p:Version=$version
          Compress-Archive -Path dist/ClipLift.exe, dist/ClipLift.exe.config -DestinationPath "ClipLift-$version.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: ClipLift-*.zip
          generate_release_notes: true
